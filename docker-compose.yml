services:
  # Development mode - hot reload
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    profiles:
      - dev
    ports:
      - "3013:3013"
    volumes:
      - ./content:/app/content
      - ./templates:/app/templates
      - ./src:/app/src
      - /app/src/node_modules
      - ./config.json:/app/config.json
      - ./public:/app/public
    working_dir: /app/src
    environment:
      - NODE_ENV=dev
    command: sh -c "cd /app/src && npm run build && (npm run serve &) && npm run dev"

  # Production mode - build once and serve
  prod:
    image: ghcr.io/aallali/mywebsite:latest
    pull_policy: always
    profiles:
      - prod
    networks:
      - global-net
    expose:
      - "3013"
    restart: always
    environment:
      - NODE_ENV=prod
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.allali.rule=Host(`allali.me`) || Host(`www.allali.me`)"
      - "traefik.http.routers.allali.entrypoints=websecure"
      - "traefik.http.routers.allali.tls.certresolver=letsencrypt"
      - "traefik.http.services.allali.loadbalancer.server.port=3013"
      # Optional: HTTP to HTTPS redirect
      - "traefik.http.routers.allali-http.rule=Host(`allali.me`) || Host(`www.allali.me`)"
      - "traefik.http.routers.allali-http.entrypoints=web"
      - "traefik.http.routers.allali-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  # Auto-update prod image for latest version
  watchtower:
    image: containrrr/watchtower:latest
    profiles:
      - prod
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_LABEL_ENABLE=true
    restart: always
    networks:
      - global-net

networks:
  global-net:
    external: true
